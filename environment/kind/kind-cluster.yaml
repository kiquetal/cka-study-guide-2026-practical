# kind cluster: 1 control-plane + 2 workers
# Usage:
#   kind create cluster --name cka-lab --config kind-cluster.yaml
#   kubectl get nodes
#   kind delete cluster --name cka-lab
#
# Pin the node image to a specific Kubernetes version for reproducibility.
# Find images at: https://github.com/kubernetes-sigs/kind/releases
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cka-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
    # Expose ports for Ingress/Gateway experiments later (optional).
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.31.0
  - role: worker
    image: kindest/node:v1.31.0
